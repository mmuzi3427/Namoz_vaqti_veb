<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Player - Telegram Web App</title>
    <!-- Telegram Web App JS kutubxonasi -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--tg-theme-bg-color, #0f0f0f);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 standart video nisbati */
            height: 0;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .btn-youtube {
            background-color: #ff0000;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s;
            box-shadow: 0 4px 12px rgba(255, 0, 0, 0.3);
        }
        .btn-youtube:hover {
            opacity: 0.85;
        }
        .error-box {
            text-align: center;
            padding: 20px;
            color: #ff4d4d;
            font-size: 18px;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Video pleyer qismi -->
        <div id="player-section" class="hidden">
            <div class="video-container">
                <iframe id="youtubePlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <a id="openInAppBtn" href="#" target="_blank" class="btn-youtube">
                ▶ YouTube ilovasida ko'rish
            </a>
        </div>

        <!-- Xatolik xabari (havola topilmasa) -->
        <div id="error-section" class="hidden error-box">
            <h2>Xatolik!</h2>
            <p>Video havolasi topilmadi yoki noto'g'ri ko'rsatilgan.</p>
        </div>
    </div>

    <script>
        // Telegram WebApp ni sozlash
        let tg = window.Telegram.WebApp;
        tg.expand(); // To'liq ekranga ochish

        window.onload = function() {
            // URL parametridan 'url' ni o'qib olish
            const urlParams = new URLSearchParams(window.location.search);
            const youtubeUrl = urlParams.get('url');

            if (youtubeUrl) {
                const videoId = extractVideoID(youtubeUrl);
                
                if (videoId) {
                    // Videoni pleyerga yuklash (autoplay=1 bilan o'zi boshlanadi, foydalanuvchi faqat play/pause qiladi)
                    document.getElementById('youtubePlayer').src = `https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1`;
                    
                    // YouTube ilovasida ochish uchun havola
                    document.getElementById('openInAppBtn').href = `https://www.youtube.com/watch?v=${videoId}`;
                    
                    // Pleyerni ko'rsatish
                    document.getElementById('player-section').classList.remove('hidden');
                } else {
                    showError();
                }
            } else {
                showError();
            }
        };

        // YouTube ID ni har qanday formatdagi havoladan ajratib olish funksiyasi
        function extractVideoID(url) {
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function showError() {
            document.getElementById('error-section').classList.remove('hidden');
        }
    </script>
</body>
</html>
