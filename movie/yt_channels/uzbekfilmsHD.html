<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Kino Vaqti — Videolar</title>
<link rel="stylesheet" href="styles.css" type="text/css" media="all" />
</head>
<body>
     <div class="navbar">
         <div class="flix_box">
             <div class="brend__img">
          <img class="brend__logo" src="https://hooks.pro/media/2025/12/08/bot8181648413/photos/IHcG/file_0.jpg" alt="Brend logo" />
        </div>
        <div class="search">
            
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" style="padding:0"><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input id="searchInput" style="padding:0" placeholder="Kino nomi, rejissor, yil..." />
            <button id="darkToggle" class="btn" title="Toggle theme">🌗</button>
        </div>
        
         </div>
        
        <!-- Modal -->
<div id="modal" class="modal" onclick="if(event.target===this) closeModal()">
  <div class="modal-content" role="dialog" aria-modal="true">
    <div class="modal-top">
      <div style="margin-top:12px">
      <iframe id="player" class="player-frame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
      
      <div>
        <div id="modalTitle" class="modal-title">Title</div>
        <div id="modalDesc" style="color:var(--muted);font-size:13px;padding-top:6px"></div>
      </div>
      <div style="display:flex;gap:0px;align-items:center">
        <button id="modalClose" class="close-btn">✕ Yopish</button>
      </div>
    </div>

    

    <div class="info-row" id="videoInfo" style="margin-top:12px">
      <!-- stats pills -->
    </div>
  </div>
</div>
    </div>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">
        <img class="logo__img" src="https://hooks.pro/media/2025/12/08/bot8181648413/photos/IHcG/file_0.jpg" alt="K" />
        
      </div>
      <div>
        <div class="title">🍿 Kino Vaqti</div>
        <div style="font-size:12px;color:var(--muted)">Badiiy filmlar va o‘zbek kinolar</div>
      </div>
    </div>
    
    <br />
   
    <div class="controls" style="flex:1;margin-left:12px">
      <div class="controls-right" style="margin-left:12px">
        <button id="refreshBtn" class="btn">↻ yangilash</button>
      </div>
    </div>
  </div>

  <div class="filters" id="playlistsWrap" style="margin-top:12px">
    <div class="filter-item active" data-pl="__ALL__">Barcha videolar</div>
    <!-- playlists injected here -->
  </div>

  <div id="grid" class="grid">
    <!-- cards injected -->
  </div>

  <div id="loading" style="text-align:center;padding:18px;display:none;color:var(--muted)">
    Yuklanmoqda...
  </div>

  <div class="footer">Kino Vaqti — Mini App</div>
</div>

<button id="toTop" class="to-top">↑ Tepaga</button>


<script src="app.js"></script>
</body>
</html>
