<!-- index.html — Telegram Premium style YouTube MiniApp
     FEATURES: uploads playlist (all videos), playlists filter, infinite scroll,
               search, modal player with stats (views,likes,duration), skeleton,
               dark-mode, back-to-top, Telegram WebApp integration.
     Replace: API_KEY and CHANNEL_ID before use.
-->
<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Kino Vaqti — Videolar</title>

<!-- Styles (Variant A: premium neon/gradient) -->
<style>
:root{
  --bg:#071022; --card:#081426; --muted:#9fb0c8; --accent:#2AABEE;
  --glass: rgba(255,255,255,0.03);
  --neon: rgba(42,171,238,0.14);
}
*{box-sizing:border-box}
html,body {
    height:100%;
    margin:0;
    font-family:Inter, ui-sans-serif, system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
}
body {
    background:linear-gradient(180deg, #031021 0%, #071c2b 100%); 
    color: #e6f3ff; 
    -webkit-font-smoothing: antialiased;
}
.app{
  max-width:1100px;
  margin:0 auto;
  padding:10px;
}

/* Top bar */
.topbar{
    display:inline-block;
    padding:1px 8px;
    margin: 0;
    border-radius:12px;
    background:linear-gradient(90deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));box-shadow:0 6px 18px rgba(2,6,23,0.6);
    backdrop-filter: blur(6px);
}
.brand {
    display:inline-block;
    width: 90%;
    text-align: center;
}
.logo{
  width:46px;
  height:46px;
  border-radius:10px;
  background:linear-gradient(135deg,#2AABEE,#3AE2C0);
  display:inline-block;
  align-items: center;
  vertical-align: middle;
  font-weight:700;
  color:#04243a;
  font-size:40px;
  box-shadow:0 6px 20px rgba(42,171,238,0.12);
}
.title{
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.2px;
    
}

.controls{
    display:inline-block;
    gap:8px;
    align-items:center
}
.btn{padding:9px 12px;border-radius:10px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-weight:600}
.btn.primary{background:linear-gradient(90deg,#2AABEE,#53d4b8);color:#001623;box-shadow:0 8px 28px rgba(42,171,238,0.12)}
.search{flex:1;margin-left:12px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.02)}
.search input{flex:1;background:transparent;border:0;outline:none;color:var(--muted);font-weight:600}

/* layout */
.controls-right{display:flex;gap:8px;align-items:center}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.filter-item{padding:8px 10px;border-radius:10px;background:transparent;border:1px solid rgba(255,255,255,0.03);cursor:pointer;color:var(--muted)}
.filter-item.active{background:var(--neon);box-shadow:0 8px 24px rgba(42,171,238,0.06);color:#e9fbff}

/* grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}

.card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:12px;padding:8px;cursor:pointer;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,0.02);transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-6px);box-shadow:0 20px 50px rgba(2,6,23,0.6)}
.thumb{width:100%;height:140px;border-radius:8px;object-fit:cover;background:#0b1520;display:block}
.card-body{padding:8px 6px}
.title-small{font-size:13px;margin:0 0 8px 0;color:#e6f3ff;line-height:1.2}
.meta{font-size:12px;color:var(--muted)}

/* skeleton */
.skeleton{background:linear-gradient(90deg,#0b1b2a,#071224,#0b1b2a);animation:shimmer 1.2s infinite}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* modal */
.modal{position:fixed;inset:0;background:rgba(1,6,12,0.75);display:none;align-items:center;justify-content:center;padding:18px;z-index:1200}
.modal-content{width:100%;max-width:960px;background:linear-gradient(180deg,#021423,#03182b);border-radius:12px;padding:14px;border:1px solid rgba(255,255,255,0.03)}
.modal-top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.modal-title{font-weight:700;color:#e6f3ff}
.close-btn{background:transparent;border:1px solid rgba(255,255,255,0.03);color:var(--muted);padding:8px 10px;border-radius:10px;cursor:pointer}
.player-frame{width:100%;height:480px;border-radius:10px;border:0;background:#000}

/* info row */
.info-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.info-pill{background:rgba(255,255,255,0.02);padding:6px 10px;border-radius:999px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}

/* back to top */
.to-top{position:fixed;right:16px;bottom:16px;background:linear-gradient(90deg,#2AABEE,#53d4b8);color:#001623;padding:10px;border-radius:12px;border:0;cursor:pointer;box-shadow:0 10px 30px rgba(42,171,238,0.12);display:none;z-index:1000;}

/* footer */
.footer{text-align:center;padding:12px;color:var(--muted);font-size:13px;margin-top:18px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">K</div>
      <div>
        <div class="title">🍿 Kino Vaqti</div>
        <div style="font-size:12px;color:var(--muted)">Badiiy filmlar va o‘zbek kinolar</div>
      </div>
    </div>
    
    <br />

    <div class="controls" style="flex:1;margin-left:12px">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="opacity:.8"><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" placeholder="Kino nomi, rejissor, yil..." />
        <button id="darkToggle" class="btn" title="Toggle theme">🌗</button>
      </div>
      <div class="controls-right" style="margin-left:12px">
        <button id="refreshBtn" class="btn">↻ yangilash</button>
      </div>
    </div>
  </div>

  <div class="filters" id="playlistsWrap" style="margin-top:12px">
    <div class="filter-item active" data-pl="__ALL__">Barcha videolar</div>
    <!-- playlists injected here -->
  </div>

  <div id="grid" class="grid">
    <!-- cards injected -->
  </div>

  <div id="loading" style="text-align:center;padding:18px;display:none;color:var(--muted)">
    Yuklanmoqda...
  </div>

  <div class="footer">Kino Vaqti — Mini App</div>
</div>

<button id="toTop" class="to-top">↑ Tepaga</button>

<!-- Modal -->
<div id="modal" class="modal" onclick="if(event.target===this) closeModal()">
  <div class="modal-content" role="dialog" aria-modal="true">
    <div class="modal-top">
      <div>
        <div id="modalTitle" class="modal-title">Title</div>
        <div id="modalDesc" style="color:var(--muted);font-size:13px;margin-top:6px"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button id="modalClose" class="close-btn">✕ Yopish</button>
      </div>
    </div>

    <div style="margin-top:12px">
      <iframe id="player" class="player-frame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <div class="info-row" id="videoInfo" style="margin-top:12px">
      <!-- stats pills -->
    </div>
  </div>
</div>

<script>
/* ========== CONFIG ========== */
/* Put your API key and CHANNEL ID here */
const API_KEY = "AIzaSyAafNm-EukR2jWNsssOhFa_aDMYj6wmQEQ";
const CHANNEL_ID = "UCZWkcTIGDg5gHyafm2M4Pig";
/* ============================ */

const tg = window.Telegram?.WebApp || null;
try { if (tg) { tg.expand(); tg.MainButton.hide(); } } catch(e){}

const grid = document.getElementById('grid');
const loadingEl = document.getElementById('loading');
const searchInput = document.getElementById('searchInput');
const playlistsWrap = document.getElementById('playlistsWrap');
const modal = document.getElementById('modal');
const player = document.getElementById('player');
const modalTitle = document.getElementById('modalTitle');
const modalDesc = document.getElementById('modalDesc');
const videoInfo = document.getElementById('videoInfo');
const toTop = document.getElementById('toTop');
const refreshBtn = document.getElementById('refreshBtn');
const darkToggle = document.getElementById('darkToggle');

let uploadsPlaylistId = "";
let nextPageToken = "";
let isLoading = false;
let allVideos = []; // playlistItems objects with contentDetails
let currentFilter = "__ALL__"; // playlist id or __ALL__
let playlistMap = {}; // id->title

// UTIL
function qsel(s){return document.querySelector(s)}
function fmtNumber(n){ return n?.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",") || "0" }
function timeISOtoReadable(ISO){
  try{const d=new Date(ISO); return d.toLocaleDateString();}catch(e){return ISO}
}

// SKELETON card
function renderSkeletons(n=8){
  grid.innerHTML = "";
  for(let i=0;i<n;i++){
    const div = document.createElement('div');
    div.className='card';
    div.innerHTML = `<div style="height:140px;border-radius:8px;margin-bottom:8px" class="skeleton"></div>
      <div style="height:14px;width:80%;border-radius:8px" class="skeleton"></div>
      <div style="height:10px;width:50%;margin-top:8px;border-radius:8px" class="skeleton"></div>`;
    grid.appendChild(div);
  }
}

// Show error -> small fallback
function showError(msg){loadingEl.style.display='block';loadingEl.innerText=msg;}

// Fetch helper
async function fetchJson(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error('Network Error '+res.status);
  return await res.json();
}

/* ========== 1) get uploads playlist ID & channel playlists ========== */
async function initChannel(){
  renderSkeletons(8);
  try{
    const url = `https://www.googleapis.com/youtube/v3/channels?part=contentDetails,snippet&id=${CHANNEL_ID}&key=${API_KEY}`;
    const data = await fetchJson(url);
    if(!data.items || !data.items.length) throw new Error('Kanal topilmadi yoki API javob bermadi');
    uploadsPlaylistId = data.items[0].contentDetails.relatedPlaylists.uploads;
    // channel playlists (for filters)
    await loadPlaylists(); // populate playlistMap + UI
    // finally load first videos
    grid.innerHTML = "";
    await loadVideos(true);
  }catch(err){
    console.error(err);
    showError('Kanalni yuklashda xato: '+err.message);
  }
}

/* ========== playlists list (channel's playlists) ========== */
async function loadPlaylists(){
  try{
    const url = `https://www.googleapis.com/youtube/v3/playlists?part=snippet&channelId=${CHANNEL_ID}&maxResults=50&key=${API_KEY}`;
    const data = await fetchJson(url);
    // clear existing except "All"
    playlistsWrap.querySelectorAll('.filter-item[data-pl]').forEach(el=>{
      if(el.dataset.pl!=='__ALL__') el.remove();
    });
    data.items?.forEach(pl=>{
      const id = pl.id; const t = pl.snippet.title;
      playlistMap[id]=t;
      const btn = document.createElement('div');
      btn.className='filter-item';
      btn.dataset.pl=id;
      btn.innerText = t;
      btn.onclick = ()=>{ selectPlaylist(id) };
      playlistsWrap.appendChild(btn);
    });
  }catch(e){ console.warn('playlists fetch fail',e) }
}

/* ========== 2) load playlistItems (uploads or chosen playlist) with videos.list for stats ========== */
async function loadVideos(reset=false){
  if(isLoading) return;
  isLoading = true;
  loadingEl.style.display='block';
  if(reset){ nextPageToken=null; allVideos=[]; grid.innerHTML=''; }

  // choose playlist id
  const playlistId = (currentFilter==='__ALL__') ? uploadsPlaylistId : currentFilter;
  if(!playlistId){ showError('Uploads playlist not found'); return; }

  try{
    // get playlistItems
    let url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&playlistId=${playlistId}&maxResults=50&key=${API_KEY}`;
    if(nextPageToken) url+=`&pageToken=${nextPageToken}`;
    const data = await fetchJson(url);
    nextPageToken = data.nextPageToken || null;

    // collect videoIds (batches of up to 50)
    const vids = data.items.filter(i=>i.contentDetails && i.contentDetails.videoId).map(i=>i.contentDetails.videoId);
    if(vids.length){
      // get details for these videos
      const infoUrl = `https://www.googleapis.com/youtube/v3/videos?part=snippet,contentDetails,statistics&id=${vids.join(',')}&key=${API_KEY}`;
      const info = await fetchJson(infoUrl);
      // map id->info
      const infoMap = {};
      info.items.forEach(it=>infoMap[it.id]=it);
      // render cards and push to allVideos
      for(const item of data.items){
        const vid = item.contentDetails.videoId;
        const infoObj = infoMap[vid] || null;
        // use snippet from infoObj (more complete) or playlist item snippet
        const snippet = infoObj?.snippet || item.snippet;
        const stats = infoObj?.statistics || {};
        const cd = infoObj?.contentDetails || {};
        const cardObj = { id:vid, snippet, stats, contentDetails:cd };
        allVideos.push(cardObj);
        // render card immediate
        appendCard(cardObj);
      }
    }
    // if more pages, we can keep infinite scroll
    if(!nextPageToken){
      // no more
    }
    loadingEl.style.display='none';
  }catch(err){
    console.error(err);
    showError('Videolarni olishda xato: '+err.message);
  }finally{
    isLoading=false;
  }
}

/* append card to grid */
function appendCard(v){
  const div = document.createElement('div');
  div.className='card';
  // prefer high-res thumb
  const thumb = (v.snippet.thumbnails?.maxres?.url) || (v.snippet.thumbnails?.standard?.url) || (v.snippet.thumbnails?.high?.url) || (v.snippet.thumbnails?.medium?.url) || '';
  const title = escapeHtml(v.snippet.title);
  const date = timeISOtoReadable(v.snippet.publishedAt || v.snippet.publishedAt);
  const views = fmtNumber(v.stats?.viewCount || 0);
  div.innerHTML = `
    <img class="thumb" src="${thumb}" loading="lazy" alt="${title}" />
    <div class="card-body">
      <div class="title-small">${title}</div>
      <div class="meta">${date} • ${views} views</div>
    </div>
  `;
  div.onclick = ()=> openModal(v.id);
  grid.appendChild(div);
}

/* ========== search (local on allVideos) ========== */
let searchTimer=null;
searchInput.addEventListener('input', ()=>{
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>performSearch(searchInput.value.trim()), 250);
});
function performSearch(q){
  q = q.toLowerCase();
  grid.innerHTML='';
  if(!q){
    // show loaded items only (allVideos)
    allVideos.forEach(v=>appendCard(v));
    return;
  }
  const filtered = allVideos.filter(v=>{
    const t = (v.snippet.title||'').toLowerCase();
    const d = (v.snippet.description||'').toLowerCase();
    return t.includes(q) || d.includes(q);
  });
  if(!filtered.length){
    grid.innerHTML = `<div style="padding:20px;color:var(--muted)">Qidiruvga mos video topilmadi</div>`;
    return;
  }
  filtered.forEach(v=>appendCard(v));
}

/* ========== playlist filter selection ========== */
function selectPlaylist(plId){
  currentFilter = plId;
  // UI
  playlistsWrap.querySelectorAll('.filter-item').forEach(el=>el.classList.remove('active'));
  const el = playlistsWrap.querySelector(`.filter-item[data-pl="${plId}"]`);
  if(el) el.classList.add('active');
  else playlistsWrap.querySelector('.filter-item[data-pl="__ALL__"]').classList.add('active');
  // reset and load
  nextPageToken=null; allVideos=[]; grid.innerHTML=''; renderSkeletons(6);
  // load new
  setTimeout(()=>loadVideos(true), 120);
}

/* ========== modal player & stats ========= */
async function openModal(videoId){
  // find video in allVideos
  const v = allVideos.find(x=>x.id===videoId);
  // if we have full info already, use that, else fetch videos.list
  if(!v || !v.stats){
    try{
      const info = await fetchJson(`https://www.googleapis.com/youtube/v3/videos?part=snippet,contentDetails,statistics&id=${videoId}&key=${API_KEY}`);
      if(info.items && info.items[0]) {
        const it=info.items[0];
        showModal(it);
        return;
      }
    }catch(e){ console.warn(e) }
  }
  showModal(v);
}
function showModal(v){
  modalTitle.innerText = v.snippet.title;
  modalDesc.innerText = v.snippet.description ? (v.snippet.description.slice(0,200)+'...') : '';
  player.src = `https://www.youtube.com/embed/${v.id}?autoplay=1&rel=0`;
  // video info pills: duration, views, likes, date
  videoInfo.innerHTML = '';
  const dur = v.contentDetails?.duration || '';
  const views = fmtNumber(v.stats?.viewCount || 0);
  const likes = fmtNumber(v.stats?.likeCount || 0);
  const date = timeISOtoReadable(v.snippet.publishedAt || v.snippet.publishedAt);
  const pills = [
    {t:fmtDuration(dur), i:'⏱'},
    {t:views+' views', i:'👁'},
    {t:likes+' likes', i:'👍'},
    {t:date, i:'📅'}
  ];
  pills.forEach(p=>{
    const el = document.createElement('div');
    el.className='info-pill';
    el.innerText = `${p.i} ${p.t}`;
    videoInfo.appendChild(el);
  });
  modal.style.display='flex';
  // show tg BackButton if present
  try{ if(tg) tg.BackButton.show(); }catch(e){}
}
function closeModal(){
  player.src='';
  modal.style.display='none';
  try{ if(tg) tg.BackButton.hide(); }catch(e){}
}

/* duration converter (ISO 8601 to mm:ss or hh:mm:ss) */
function fmtDuration(iso){
  if(!iso) return '';
  // e.g. PT1H2M30S or PT5M12S or PT45S
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if(!m) return iso;
  const h = parseInt(m[1]||0), mm = parseInt(m[2]||0), ss = parseInt(m[3]||0);
  const pad = n=>n<10?('0'+n):n;
  if(h>0) return `${h}:${pad(mm)}:${pad(ss)}`;
  return `${mm}:${pad(ss)}`;
}

/* infinite scroll */
window.addEventListener('scroll', ()=>{
  // show toTop
  if(window.scrollY>600) toTop.style.display='block'; else toTop.style.display='none';
  // near bottom -> load more
  if(window.innerHeight + window.scrollY >= document.body.offsetHeight - 420){
    if(nextPageToken && !isLoading) loadVideos();
  }
});

/* back to top */
toTop.addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

/* refresh */
refreshBtn.addEventListener('click', ()=>{
  nextPageToken=null; allVideos=[]; grid.innerHTML=''; renderSkeletons(6); loadVideos(true);
});

/* modal close */
document.getElementById('modalClose').addEventListener('click', closeModal);

/* Escape key to close */
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });

/* dark toggle — small motion (for demo, toggles CSS variables) */
let dark = true;
darkToggle.addEventListener('click', ()=>{
  dark = !dark;
  if(!dark){
    document.documentElement.style.setProperty('--bg','#fff');
    document.documentElement.style.setProperty('--card','#fff');
    document.documentElement.style.setProperty('--muted','#666');
    document.documentElement.style.setProperty('--accent','#ff6b6b');
  } else {
    document.documentElement.style.setProperty('--bg','#071022');
    document.documentElement.style.setProperty('--card','#081426');
    document.documentElement.style.setProperty('--muted','#9fb0c8');
    document.documentElement.style.setProperty('--accent','#2AABEE');
  }
});

/* escape HTML */
function escapeHtml(s){ if(!s) return ''; return s.replaceAll('&','&').replaceAll('<','<').replaceAll('>','>'); }

/* ========== init ========== */
renderSkeletons(8);
initChannel();

/* Telegram BackButton integration:
   When modal open -> BackButton closes modal (handled above by tg.BackButton in showModal/closeModal)
   Also if user presses native back and modal closed, we can call tg.close()
*/
if(tg){
  try{
    tg.BackButton.onClick(()=>{
      // if modal open -> close; else close webapp
      if(modal.style.display==='flex'){ closeModal(); } else { try{ tg.close(); }catch(e){} }
    });
  }catch(e){ console.warn(e) }
}
</script>
</body>
</html>
